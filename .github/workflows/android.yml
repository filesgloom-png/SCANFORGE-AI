name: SCANFORGE AI Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/filesgloom/scanforge/MainActivity.kt
          grep -q 'com.filesgloom.scanforge' app/build.gradle.kts
          echo "Project structure checks passed."

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Report APK size breakdown
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from collections import defaultdict

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          if not os.path.isfile(apk):
              raise SystemExit("APK missing before size analysis.")

          with zipfile.ZipFile(apk) as archive:
              entries = [item for item in archive.infolist() if not item.is_dir()]
          abi_sizes = defaultdict(int)
          for item in entries:
              parts = item.filename.split("/")
              if len(parts) >= 3 and parts[0] == "lib":
                  abi_sizes[parts[1]] += item.file_size

          print("APK_UNCOMPRESSED_BYTES={}".format(sum(item.file_size for item in entries)))
          for abi, size in sorted(abi_sizes.items(), key=lambda pair: pair[1], reverse=True):
              print("APK_ABI_BYTES {}={}".format(abi, size))
          print("APK_LARGEST_ENTRIES_BEGIN")
          for item in sorted(entries, key=lambda entry: entry.file_size, reverse=True)[:25]:
              print("{} {}".format(item.file_size, item.filename))
          print("APK_LARGEST_ENTRIES_END")
          PY

      - name: Report unit test totals
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          if not reports:
              raise SystemExit("No unit test XML reports were generated.")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, "0"))

          print(
              "UNIT_TESTS total={tests} failures={failures} "
              "errors={errors} skipped={skipped}".format(**totals)
          )
          if totals["failures"] or totals["errors"] or totals["tests"] == 0:
              raise SystemExit("Unit test report indicates a failure.")
          PY

      - name: Verify APK integrity and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          APK_SIZE_BYTES=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$APK_SHA256" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK verification passed." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SCANFORGE-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
